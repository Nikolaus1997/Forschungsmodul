# Problem description
OutputName =GAM2N80PP2
# Polynomial degree
PP_N =2       
# physical size of the domain
physicalSizeStart =-6.
physicalSizeEnd =6. 
endTime = 1.#6.28318530717958647692528676655 # duration of the simulation
# Numerical parameters                                      
fluxFunction =linear
RiemannSolver = central
Epsilon = 0.01
# Limiter parameters
useLimiter =true
useModLimiter = true
useSource = false
useTransport = false
transportFlux = linear
# Time stepping parameters
CFL = .9
timeStepping = RK # Either Euler or RK
maximumDt = 1e-1
# Output parameters
nWriteState=10000
initialCondition =gaussian# Options: gaussian, unitStep, negativeUnitStep, barenblatt, divorce, sinus
BarenblattM = 2
BarenblattTime= 1.0
# Error parameters
initCondA = -1.5
initCondB = 1.5
# Discretization parameters    
nCells =80      

# Problem description
OutputName = TimeHBLM3P2N320
# Polynomial degree
PP_N = 2
# physical size of the domain
physicalSizeStart =-6.#6.28318530717958647692528676655
physicalSizeEnd =6.#28318530717958647692528676655
endTime = 1.#6.28318530717958647692528676655 # duration of the simulation
# Numerical parameters                                      
fluxFunction =linear # Options: linear, central, upwind, lax, barenblatt
RiemannSolver = central

# Problem description
OutputName = BBM2P4N80
# Polynomial degree
PP_N = 4
# physical size of the domain
physicalSizeStart =-6.#6.28318530717958647692528676655
physicalSizeEnd =6.#28318530717958647692528676655
endTime = 0.05#6.28318530717958647692528676655 # duration of the simulation
# Numerical parameters                                      
fluxFunction =linear# Options: linear, burgers, BuckeleyLeverette, lax, ldg
RiemannSolver = central # Options: linear, central, upwind, lax
Epsilon = 0.01
# Limiter parameters
limiterType = minmod # Options: minmod, superbee, vanLeer, vanAlbada, none
extendLimiter =true
useLimiter =true
useModLimiter = true
# Time stepping parameters
CFL = 0.9
timeStepping = RK # Either Euler or RK
maximumDt = 1e-1
# Output parameters
nWriteState = 10000000000000000000
initialCondition =barenblatt# Options: gaussian, unitStep, negativeUnitStep, barenblatt, divorce, sinus, diffDoubleUnitStep, unitDoubleStep, waitingTime
# Barenblatt parameters
BarenblattM = 2
BarenblattTime= 1.0
useSource = false
useTransport = false
transportFlux = linear
# Error parameters
initCondA = -1.5
initCondB = 1.5
# Discretization parameters    
nCells = 80

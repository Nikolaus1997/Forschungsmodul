timeStepping = RK # Either Euler or RK
maximumDt = 1e-1
# Output parameters
nWriteState = 10000000000000000000000000000000000000000
initialCondition =gaussian# Options: gaussian, unitStep, negativeUnitStep, barenblatt, divorce, sinus, diffDoubleUnitStep, unitDoubleStep, waitingTime
# Barenblatt parameters
BarenblattM = 3
BarenblattTime= 1.0
useSource = false
useTransport = false
transportFlux = linear
# Error parameters
initCondA = -1.5
initCondB = 1.5
# Discretization parameters    
nCells = 120
